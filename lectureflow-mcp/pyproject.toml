[project]
name = "lectureflow-mcp"
version = "0.1.0"
description = "MCP-сервер для доступа к записям LectureFlow"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pydantic>=2.14.3",
]

[project.scripts]
lectureflow-mcp = "lectureflow_mcp.main:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
