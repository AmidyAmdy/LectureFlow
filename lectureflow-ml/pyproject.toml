[project]
name = "lectureflow-ml"
version = "0.1.0"
description = "Локальная транскрибация аудио и конспектирование частей"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.124",
    "mlx-whisper>=0.4.3",
    "ollama>=0.6.3",
    "pika>=1.4.4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
lectureflow-ml = "lectureflow_ml:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
