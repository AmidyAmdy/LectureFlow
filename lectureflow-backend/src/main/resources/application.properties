spring.application.name=lectureflow-backend

spring.datasource.url=${LECTUREFLOW_DB_URL:jdbc:postgresql://127.0.0.1:5433/lectureflow}
spring.datasource.username=${LECTUREFLOW_DB_USERNAME:lectureflow}
spring.datasource.password=${LECTUREFLOW_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.flyway.baseline-on-migrate=false
spring.jpa.open-in-view=false

lectureflow.s3.endpoint=${LECTUREFLOW_S3_ENDPOINT:http://127.0.0.1:9000}
lectureflow.s3.access-key=${LECTUREFLOW_S3_ACCESS_KEY}
lectureflow.s3.secret-key=${LECTUREFLOW_S3_SECRET_KEY}
lectureflow.s3.bucket=${LECTUREFLOW_S3_BUCKET:lectureflow-audio}

spring.servlet.multipart.max-file-size=${LECTUREFLOW_MAX_UPLOAD_SIZE:200MB}
spring.servlet.multipart.max-request-size=${LECTUREFLOW_MAX_UPLOAD_SIZE:200MB}
server.tomcat.max-swallow-size=-1

spring.rabbitmq.host=${LECTUREFLOW_RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${LECTUREFLOW_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${LECTUREFLOW_RABBITMQ_USERNAME:lectureflow}
spring.rabbitmq.password=${LECTUREFLOW_RABBITMQ_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2

lectureflow.opensearch.url=${LECTUREFLOW_OPENSEARCH_URL:http://127.0.0.1:9200}
lectureflow.opensearch.index=${LECTUREFLOW_OPENSEARCH_INDEX:transcription-segments-v2}
spring.http.clients.connect-timeout=3s
spring.http.clients.read-timeout=30s

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
